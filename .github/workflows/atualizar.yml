name: atualizar
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 merge.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add minha_lista.m3u8 grupos.txt
          git commit -m "atualiza" || exit 0
          git push
